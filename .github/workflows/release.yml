# Compila los instaladores de Windows, macOS y Linux y los sube a un release de GitHub.
# Se dispara al subir una etiqueta de versión:   git tag v0.1.0 && git push origin v0.1.0
# El release queda como borrador para revisarlo y publicarlo a mano.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            args: ''
          - plataforma: macos-latest
            args: '--target universal-apple-darwin'
          - plataforma: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.plataforma }}

    steps:
      - uses: actions/checkout@v5

      - name: Dependencias de Linux
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          # La misma versión con la que se generó package-lock.json
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS: binario universal (Intel y Apple Silicon)
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # npm install y no npm ci: el lockfile generado en Windows no trae las dependencias opcionales
      # de otros sistemas (npm/cli#4828) y npm ci falla en macOS y Linux
      - run: npm install --no-audit --no-fund

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Al Día v__VERSION__'
          releaseBody: 'Descargá el instalador de tu sistema en Assets. No está firmado: en Windows tocá "Más información → Ejecutar de todas formas"; en macOS, clic derecho → Abrir.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
