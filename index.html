<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al Día</title>
    <script>
      // Tema antes de pintar, para que no destelle en blanco
      try {
        var t = JSON.parse(localStorage.getItem('aldia-ajustes') || '{}').tema
        if (t === 'oscuro' || ((!t || t === 'sistema') && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
