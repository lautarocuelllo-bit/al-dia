[package]
name = "aldia"
version = "0.1.0"
description = "Las entregas de tu campus Moodle en un widget de escritorio"
authors = ["Lautaro Cuello"]
license = "MIT"
edition = "2024"

[lib]
# El sufijo _lib evita un conflicto de nombres con el binario en Windows (rust-lang/cargo#8519)
name = "aldia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Llavero del sistema: Administrador de credenciales (Windows), Llavero (macOS), Secret Service (Linux)
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
